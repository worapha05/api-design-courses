syntax = "proto3";

package aether.v1;

message Item {
  string sku = 1;
  string name = 2;
  int32 quantity = 3;
}

message GetItemRequest {
  string sku = 1;
}

message ReserveRequest {
  string sku = 1;
  int32 qty = 2;
}

service Inventory {
  rpc GetItem(GetItemRequest) returns (Item);
  rpc Reserve(ReserveRequest) returns (Item);
}
