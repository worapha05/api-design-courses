type Book {
  id: ID!
  title: String!
  author: String!
  price: Float!
  stock: Int!
  reviews: [Review!]!
}

type Review {
  id: ID!
  rating: Int!
  comment: String!
  bookId: ID!
}

type Query {
  book(id: ID!): Book
  books: [Book!]!
}

type Mutation {
  addReview(bookId: ID!, rating: Int!, comment: String!): Review!
}
